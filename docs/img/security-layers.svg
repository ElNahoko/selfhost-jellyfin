<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">Security layers</title>
  <desc id="d">Layers of protection from the provider account down to backups.</desc>
  <rect x="1" y="1" width="958" height="398" rx="16" fill="#ffffff" stroke="#dde2e8"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1b1f24">Security layers</text>
  <g font-size="14">
    <rect x="24" y="52" width="912" height="40" rx="8" fill="#f3f1fd" stroke="#6a4fd8"/>
    <text x="40" y="77" font-weight="700" fill="#1b1f24">1 · Provider account</text><text x="330" y="77" fill="#5b6670">strong unique password + 2-factor; keep the recovery console handy</text>
    <rect x="24" y="100" width="912" height="40" rx="8" fill="#f3f1fd" stroke="#6a4fd8"/>
    <text x="40" y="125" font-weight="700" fill="#1b1f24">2 · Firewall (UFW)</text><text x="330" y="125" fill="#5b6670">22 (rate-limited), 80, 443 only; Jellyfin's 8096 never published</text>
    <rect x="24" y="148" width="912" height="40" rx="8" fill="#f3f1fd" stroke="#6a4fd8"/>
    <text x="40" y="173" font-weight="700" fill="#1b1f24">3 · SSH</text><text x="330" y="173" fill="#5b6670">keys only, no root, no passwords, fail2ban, AllowUsers</text>
    <rect x="24" y="196" width="912" height="40" rx="8" fill="#f3f1fd" stroke="#6a4fd8"/>
    <text x="40" y="221" font-weight="700" fill="#1b1f24">4 · HTTPS (Caddy)</text><text x="330" y="221" fill="#5b6670">publicly trusted certificate, auto-renewed, HSTS, safe headers</text>
    <rect x="24" y="244" width="912" height="40" rx="8" fill="#f3f1fd" stroke="#6a4fd8"/>
    <text x="40" y="269" font-weight="700" fill="#1b1f24">5 · Jellyfin accounts</text><text x="330" y="269" fill="#5b6670">separate admin; one account per person; no anonymous access</text>
    <rect x="24" y="292" width="912" height="40" rx="8" fill="#f3f1fd" stroke="#6a4fd8"/>
    <text x="40" y="317" font-weight="700" fill="#1b1f24">6 · Container hardening</text><text x="330" y="317" fill="#5b6670">non-root, no-new-privileges, capabilities dropped, read-only media, memory limit</text>
    <rect x="24" y="340" width="912" height="40" rx="8" fill="#e9f6ef" stroke="#1a7f4b"/>
    <text x="40" y="365" font-weight="700" fill="#1b1f24">7 · Updates &amp; backups</text><text x="330" y="365" fill="#5b6670">unattended security updates; config backup copied off the server</text>
  </g>
</svg>
