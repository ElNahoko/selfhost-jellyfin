<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141414">
<title>Nahoko · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b3b'/%3E%3Cstop offset='1' stop-color='%23c10f1d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url%28%23g%29'/%3E%3Cpath d='M20 47V17h6.6l11.6 18.6V17H44v30h-6.4L25.8 28.3V47z' fill='%23fff'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#141414;color:#f3f3f3;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:20px;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(229,9,20,.18),transparent 70%)}
main{width:100%;max-width:380px}
.brand{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:5px;row-gap:14px;margin-bottom:30px}.brand .sub{grid-column:1/-1;text-align:center}
.logo{width:52px;height:52px}
.wm{font-size:2.3rem;font-weight:800;letter-spacing:.14em;text-indent:.14em;line-height:1}
.wm i{font-style:normal;color:#e50914}
.sub{color:#a3a3a3;font-size:.95rem;margin-top:-6px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:#b3b3b3}
input{height:3rem;padding:0 1rem;border:1px solid #3d3d3d;border-radius:8px;background:#262626;color:#fff;font:inherit;font-size:1rem;width:100%}
input:focus{outline:2px solid #e50914;outline-offset:1px;border-color:transparent}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #262626 inset;-webkit-text-fill-color:#fff}
button{height:3rem;border:0;border-radius:8px;background:#e50914;color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:6px}
button:hover,button:focus-visible{background:#f6121d}
button[disabled]{opacity:.6;cursor:default}
.err{min-height:1.4em;color:#ff6b6b;font-size:.92rem;text-align:center;margin:0}
.foot{margin-top:26px;text-align:center;color:#6f6f6f;font-size:.8rem}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#c10f1d"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M20 47V17h6.6l11.6 18.6V17H44v30h-6.4L25.8 28.3V47z" fill="#fff"/></svg>
    <div class="wm">AHOKO</div>
    <div class="sub">Sign in to continue</div>
  </div>
  <form id="f" autocomplete="on">
    <label>Name<input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="e" role="alert"></p>
    <button id="b" type="submit">Sign in</button>
  </form>
  <div class="foot">Private library</div>
</main>
<script>
(function(){
var f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
var next=new URLSearchParams(location.search).get("next")||"/";
if(next.charAt(0)!=="/"||next.charAt(1)==="/"||next.indexOf("\\")>=0)next="/";
f.addEventListener("submit",function(ev){
  ev.preventDefault();e.textContent="";b.disabled=true;b.textContent="Signing in…";
  fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
    body:JSON.stringify({user:document.getElementById("u").value,pass:document.getElementById("p").value})})
  .then(function(r){return r.json().then(function(d){return[r.status,d];});})
  .then(function(x){
    if(x[0]===200){location.replace(next);return;}
    e.textContent=x[0]===429?"Too many tries. Please wait a few minutes.":"Wrong name or password.";
    b.disabled=false;b.textContent="Sign in";document.getElementById("p").select();
  }).catch(function(){e.textContent="Can’t reach the server. Try again.";b.disabled=false;b.textContent="Sign in";});
});
})();
</script>
</body>
</html>
