<style>
:root{color-scheme:dark;--bg:#141414;--card:#1c1c1c;--ink:#f3f3f3;--muted:#a3a3a3;--line:#2e2e2e;--red:#e50914}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:22px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:44px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:900;letter-spacing:.14em;font-size:1.25rem}
.brand svg{width:34px;height:34px}
.back{color:var(--muted);text-decoration:none;font-size:.92rem;border:1px solid var(--line);border-radius:99px;padding:7px 14px}
.back:hover{color:#fff;border-color:#555}
h1{font-size:2.1rem;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
.lead{color:var(--muted);font-size:1.08rem;margin:0 0 34px}
h2{font-size:1.05rem;margin:34px 0 8px}
p,li{color:#cfcfcf}
ul{padding-left:20px}li{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:22px 0}
.card b{color:#fff}
.big{font-size:1.25rem;font-weight:800;color:#fff;margin:0 0 4px}
a{color:#fff}
footer{margin-top:54px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:18px;font-size:.88rem}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:#fff}
footer{flex-wrap:wrap}
.credit{flex-basis:100%;color:var(--muted);font-size:.8rem;margin-top:4px}.credit a{color:var(--muted);text-decoration:underline}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 8px;margin:0 0 18px}
.post h2{margin:6px 0 10px;font-size:1.3rem;color:#fff}.post p{margin:0 0 14px}
.pmeta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.ptag{background:rgba(229,9,20,.15);color:#ff6b74;font-weight:700;font-size:.74rem;padding:2px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>

<div class="wrap">
