<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141414">
<title>LUMIO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%270%200%2064%2064%27%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23ff3b3b%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23c10f1d%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27url%28%23g%29%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2717%27%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%275%27/%3E%3Cpath%20d%3D%27M28%2024.5%2041%2032%2028%2039.5z%27%20fill%3D%27%23fff%27%20stroke%3D%27%23fff%27%20stroke-width%3D%272%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#141414; --side:#0e0e0e; --card:#1c1c1c; --card2:#262626; --ink:#f3f3f3; --muted:#a3a3a3; --line:#333;
  --accent:#e50914; --accent-ink:#ffffff; --soft:rgba(229,9,20,.14); --ok:#46d369; --bad:#ff6b6b; --amber:#f5a524; --shadow:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:36px;height:36px;display:block;flex:none}.logo svg{width:100%;height:100%;display:block}
.wm{font-size:1.45rem;font-weight:800;letter-spacing:.12em;line-height:1}.wm i{font-style:normal;color:#e50914}
.libs{display:flex;flex-direction:column;gap:3px}
.lib{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;color:var(--muted);font-weight:500;position:relative}
.lib:hover{background:var(--card2);color:var(--ink)}
.lib.on{background:var(--soft);color:var(--ink)}
.lib.on svg{color:var(--accent)}
.lib:focus-visible{outline:2px solid var(--accent)}
.lib .n{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.72rem;font-weight:700;min-width:1.4rem;text-align:center;padding:1px 7px}
.space{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:.82rem;color:var(--muted)}
.space b{display:block;color:var(--ink);font-weight:600;margin-bottom:8px;font-size:.9rem}
.meter{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-bottom:7px}
.meter i{display:block;height:100%;background:var(--accent);width:0}

main{padding:0 32px 120px;min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 16px;margin-bottom:6px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:180px;font-size:1.25rem;font-weight:650}
.crumbs button{all:unset;cursor:pointer;color:var(--muted);padding:3px 8px;border-radius:8px}
.crumbs button:hover{background:var(--card2);color:var(--ink)}
.crumbs button.cur{color:var(--ink);cursor:default}
.crumbs button.cur:hover{background:none}
.crumbs span{color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center;position:relative}
.search{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--ink);width:200px}
.search::placeholder{color:var(--muted)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:550;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30}
.menu button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;cursor:pointer;padding:11px 12px;border-radius:9px}
.menu button:hover{background:var(--soft)}

/* upload pill + popover */
.pill{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px 7px 10px;display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.92rem}
.pill:hover{border-color:var(--accent)}
.pill.fin{color:var(--ok)} .pill.err{color:var(--bad)}
.ring{--p:0;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--card)}
.pill.fin .ring{background:var(--ok)} .pill.err .ring{background:var(--bad)}
.queue{position:fixed;right:32px;top:74px;width:420px;max-width:calc(100vw - 20px);max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;z-index:40;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.queue>*{min-width:0}
.sum{border-radius:12px;padding:13px 15px;background:var(--soft)}
.sum .s1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sum #sTitle{font-size:1rem}
.sum #sPct{font-size:1.35rem;font-weight:700;color:var(--accent)}
.sum.fin #sPct{color:var(--ok)}
.sum .s2{color:var(--muted);font-size:.84rem;margin-top:7px;overflow-wrap:anywhere}
.sum .keep{color:var(--muted);font-size:.8rem;margin-top:7px}
.bar{height:6px;border-radius:99px;background:var(--card2);margin-top:8px;overflow:hidden}
.sum .bar{height:8px;background:var(--card)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.sum.fin .bar i,.job.done .bar i{background:var(--ok)}
.job.err .bar i{background:var(--bad)}
.job{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;min-width:0}
.job .jt{display:flex;align-items:center;gap:10px;min-width:0}
.job .ji{flex:none;width:22px;text-align:center}
.job .jn{flex:1;min-width:0}
.job .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .path{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .st{flex:none;color:var(--muted);white-space:nowrap;font-size:.84rem;text-align:right}
.job.done .st{color:var(--ok)} .job.err .st{color:var(--bad)} .job.err{border-color:var(--bad)}
.job.small{padding:6px 4px;border:0;border-top:1px solid var(--line);border-radius:0}
.job.small:first-child{border-top:0}
.job.small .bar,.job.small .path{display:none}
.job.small .name{font-weight:400}
details.grp{border:1px solid var(--line);border-radius:12px;padding:6px 12px}
details.grp>summary{cursor:pointer;color:var(--muted);padding:4px 0;font-size:.9rem}
details.grp[open]>summary{margin-bottom:4px}
.grp .body{max-height:220px;overflow:auto}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}

/* header block */
.hero{display:flex;gap:22px;margin:4px 0 28px;padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.hero .pst{flex:none;width:120px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card2)}
.hero .pst img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{margin:0 0 6px;font-size:1.6rem;line-height:1.2}
.hero .meta{color:var(--muted);font-size:.92rem;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero p{margin:0;color:var(--muted);max-width:70ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.chipx{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:.82rem;color:var(--ink);font-weight:550}
.hero.mini{padding:14px 18px;align-items:center}
.hero.mini h1{font-size:1.15rem;margin:0}

h2.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:650;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 18px;margin-bottom:30px}
.card{position:relative;min-width:0}
.card .pst{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card2);border:1px solid var(--line);transition:transform .15s,box-shadow .15s}
.card:hover .pst,.card:focus-within .pst{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:2.8rem;font-weight:700;color:rgba(255,255,255,.88)}
.card .chip{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600;opacity:0;transition:.15s;z-index:2;pointer-events:none}
.card:hover .chip,.card:focus-within .chip{opacity:1}
.card .t{margin-top:10px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .s{color:var(--muted);font-size:.85rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{position:absolute;top:8px;right:8px;opacity:0;width:32px;height:32px;border-radius:10px;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s;z-index:3}
.card:hover .x,.card .x:focus-visible{opacity:1}
.card .x:hover{background:var(--bad)}
.card a.open{all:unset;position:absolute;inset:0;cursor:pointer;border-radius:14px;z-index:1}
.card a.open:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .go{position:absolute;left:8px;right:8px;bottom:8px;z-index:3}
.card .go .btn{width:100%;justify-content:center}

.rows{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:30px}
.row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--card2)}
.row .th{flex:none;width:100px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:var(--card2);display:grid;place-items:center;color:var(--muted);position:relative}
.row .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.row .th svg{width:1.4em;height:1.4em}
.row .nm{flex:1;min-width:0}
.row .nm a{all:unset;cursor:pointer;display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm a:hover{color:var(--accent)}
.row .nm small{display:block;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{color:var(--muted);font-size:.88rem;white-space:nowrap}
.row .dt{color:var(--muted);font-size:.88rem;white-space:nowrap;width:110px;text-align:right}
.row .bad{color:var(--bad);font-size:.8rem;font-weight:650;white-space:nowrap}
.row .x{all:unset;cursor:pointer;opacity:.55;padding:7px 9px;border-radius:9px;display:grid;place-items:center}
.row .x:hover{opacity:1;background:var(--soft);color:var(--bad)}
.row .ok:hover{color:var(--ok)}
.row.req .th{width:48px;aspect-ratio:2/3}

.empty{border:2px dashed var(--line);border-radius:20px;padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{display:block;margin:0 auto 10px;width:2.2rem;height:2.2rem;opacity:.7}
.empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:4px}

/* requests */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{all:unset;cursor:pointer;padding:8px 18px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.big-search{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:1.05rem;margin-bottom:22px}
.hint{color:var(--muted);text-align:center;padding:26px 10px}
.tag{display:inline-block;font-size:.76rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--card2);color:var(--muted)}
.tag.ok{background:rgba(76,195,138,.16);color:var(--ok)}
.tag.wait{background:var(--soft);color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,5,12,.78);display:grid;place-items:center;z-index:80;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:420px;padding:24px}
.dlg h3{margin:0 0 8px;font-size:1.2rem}
.dlg p{margin:0 0 16px;color:var(--muted);overflow-wrap:anywhere}
.dlg input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end}

.veil{position:fixed;inset:0;background:rgba(10,10,20,.8);display:grid;place-items:center;z-index:50;pointer-events:none;opacity:0;transition:.15s}
.veil.on{opacity:1}
.veil div{border:2px dashed var(--accent);border-radius:22px;padding:48px 64px;font-size:1.3rem;font-weight:600;color:#fff;text-align:center}
.veil small{display:block;font-weight:400;opacity:.8;font-size:.95rem;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:90}
.toast.on{opacity:1}
.tabbar{display:none}

@media (hover:none){.card .chip{display:none}.card .x{opacity:1;background:rgba(0,0,0,.55)}}
@media (max-width:860px){
  html{font-size:17px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:0 14px 110px}
  .top{padding:14px 0 12px;gap:10px}
  .crumbs{flex:1 1 100%;font-size:1.15rem}
  .tools{flex:1 1 100%;flex-wrap:wrap}
  .search{flex:1 1 100%;order:5;width:auto}
  .tools .btn{flex:1}
  .pill{flex:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px}
  .row .dt{display:none}
  .row .th{width:76px}
  .hero{flex-direction:column;padding:16px}
  .hero .pst{width:96px}
  .queue{right:8px;left:8px;width:auto;max-width:none;top:auto;bottom:calc(72px + env(safe-area-inset-bottom));max-height:60vh}
  .menu{right:auto;left:0}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--side);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;position:relative;border-radius:10px}
  .tabbar button svg{width:1.5em;height:1.5em}
  .tabbar button.on{color:var(--accent)}
  .tabbar .n{position:absolute;top:0;left:55%;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.62rem;padding:0 5px;font-weight:700}
  .toast{bottom:84px}
  .veil div{padding:30px 28px}
}

.space .live{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.lv{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.lv b{display:inline;margin:0;font-size:.82rem}
.meter i.hot{background:var(--bad)}
.meter i{transition:width .6s}

/* posters: shared look for the library and the catalogue */
.card .pst{border:0;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.28)}
.rate{position:absolute;top:8px;left:8px;z-index:2;background:rgba(10,10,16,.72);color:#fff;border-radius:8px;padding:2px 8px;font-size:.74rem;font-weight:700;}
.rate::first-letter{color:#f5c518}
.reqbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.reqbar .seg{margin:0}
.shelf{margin-bottom:8px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 4px 16px;margin:0 -4px;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:8px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.tile{flex:none;width:156px;cursor:pointer;scroll-snap-align:start;min-width:0;border-radius:14px}
.tgrid .tile{width:auto}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.pz{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card2);box-shadow:0 2px 12px rgba(0,0,0,.28);transition:transform .18s,box-shadow .18s}
.tile:hover .pz{transform:translateY(-4px) scale(1.015);box-shadow:var(--shadow)}
.pz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pz .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;font-weight:700;color:rgba(255,255,255,.88)}
.pz::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:.18s;pointer-events:none}
.tile:hover .pz::after{opacity:1}
.add{position:absolute;right:8px;bottom:8px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .15s}
.add:hover{transform:scale(1.1)}
.add svg{width:1.3em;height:1.3em;stroke-width:2.6}
.add.have{background:var(--ok);color:#fff;cursor:default}
.add.asked{background:var(--card2);color:var(--muted);cursor:default}
.add.have:hover,.add.asked:hover{transform:none}
.tile .tt{margin-top:10px;font-weight:600;font-size:.93rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ty{color:var(--muted);font-size:.82rem}
.dlg.wide{max-width:720px;display:flex;gap:26px;padding:26px}
.dpst{position:relative;flex:none;width:230px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card2);align-self:flex-start}
.dpst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dpst .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;font-weight:700;color:var(--muted)}
.dbody{min-width:0;flex:1;display:flex;flex-direction:column}
.dbody h3{font-size:1.5rem;line-height:1.2;margin-bottom:10px}
.dbody .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.dbody .ov{color:var(--ink);opacity:.85;margin-bottom:20px;max-height:12em;overflow:auto}
.dlg .acts.wrap{flex-wrap:wrap;justify-content:flex-start;margin-top:auto}
.dlg a.btn{text-decoration:none;color:var(--ink)}
@media (max-width:860px){
  .tile{width:128px}
  .rail{gap:12px}

function svg(n,cls){var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("class","i"+(cls?" "+cls:""));s.setAttribute("aria-hidden","true");s.innerHTML=ICONS[n]||"";return s;}

/* ---------- dialogs (no browser pop-ups) ---------- */
function dialog(o){      // {title, text, input:{value,placeholder}, ok, danger, cancel} -> Promise(value|true|null)
  return new Promise(function(res){
    var m=$("modal"),prev=document.activeElement;m.innerHTML="";
    var d=el("div","dlg");d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
    d.appendChild(el("h3","",o.title));if(o.text)d.appendChild(el("p","",o.text));
    var inp=null;if(o.input){inp=el("input");inp.type="text";inp.maxLength=o.input.max||120;inp.value=o.input.value||"";inp.placeholder=o.input.placeholder||"";d.appendChild(inp);}
    var acts=el("div","acts"),done=false;
    function close(v){if(done)return;done=true;m.hidden=true;m.innerHTML="";document.removeEventListener("keydown",key,true);if(prev&&prev.focus)prev.focus();res(v);}
    function accept(){close(inp?(inp.value.trim()||null):true);}
    function key(e){if(e.key==="Escape"){e.stopPropagation();close(null);}else if(e.key==="Enter"&&inp){e.preventDefault();accept();}}
    var c=el("button","btn",o.cancel||"Cancel");c.type="button";c.onclick=function(){close(null);};
    var b=el("button","btn "+(o.danger?"danger":"primary"),o.ok||"OK");b.type="button";b.onclick=accept;
    acts.appendChild(c);acts.appendChild(b);d.appendChild(acts);m.appendChild(d);m.hidden=false;
    m.onmousedown=function(e){if(e.target===m)close(null);};
    document.addEventListener("keydown",key,true);
    (inp||b).focus();if(inp)inp.select();
  });
}

/* ---------- metadata from Jellyfin (posters, titles, sizes); everything still works without it ---------- */
async function loadHave(){

}
async function loadMeta(){
  if(GUEST)return false;

  try{
    var rs=await Promise.all([fetch("/_meta/items",{credentials:"same-origin",cache:"no-store"}),fetch("/_meta/sizes",{credentials:"same-origin",cache:"no-store"})]);
    if(rs[0].ok){META=await rs[0].json();LIBSET={};Object.keys(META).forEach(function(k){var v=META[k];if(v.t==="Movie"||v.t==="Series")LIBSET[v.t+"|"+(v.n||"").toLowerCase()+"|"+(v.y||"")]=1;});}
    if(rs[1].ok)SIZES=await rs[1].json();
    metaT=Date.now();metaBusy=false;try{sessionStorage.setItem("lm",JSON.stringify({m:META,s:SIZES}));}catch(e){}return true;
  }catch(e){}
  metaBusy=false;metaT=Date.now()-8000;return false;
}

function cleanFolder(n){      // "The Sopranos (1999) S01-S06 (1080p ...)" -> {title:"The Sopranos", year:"1999"}
  var m=n.match(/^(.*?)[\s._]*\(?((?:19|20)\d\d)\)?(?=[\s._)\-]|$)/),t;
  t=(m&&m[1].trim())?m[1]:n.replace(/[\s._]+S\d{1,2}(?:-S\d{1,2})?\b.*$/i,"");
  t=t.replace(/\[[^\]]*\]/g," ").replace(/[._]+/g," ").replace(/\s+/g," ").trim();
  return {title:t||n,year:m&&m[1].trim()?m[2]:""};
}

function renderHero(){

    x.onload=function(){(x.status>=200&&x.status<300)?res(x.status):rej(new Error("HTTP "+x.status));};

$("dirInput").onchange=function(e){enqueue([].map.call(e.target.files,function(f){return{file:f,rel:f.webkitRelativePath||f.name};}));e.target.value="";};
function readEntries(dir){return new Promise(function(res){var all=[],rd=dir.createReader();(function more(){rd.readEntries(function(b){if(!b.length)return res(all);all=all.concat([].slice.call(b));more();},function(){res(all);});})();});}
async function walk(entry,prefix,out){
  if(entry.isFile){await new Promise(function(r){entry.file(function(f){out.push({file:f,rel:prefix+entry.name});r();},r);});}
  else if(entry.isDirectory){var kids=await readEntries(entry);for(var i=0;i<kids.length;i++)await walk(kids[i],prefix+entry.name+"/",out);}
}
var veil=$("veil"),dragDepth=0;
function hasFiles(e){return e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],"Files")>=0;}
window.addEventListener("dragenter",function(e){if(!hasFiles(e))return;e.preventDefault();if(cwd==="requests"||cwd==="profiles"||cwd==="settings"||GUEST)return;dragDepth++;
  $("veilH").textContent="Drop to upload "+upWhat();$("veilT").textContent="into "+crumbLabel(cwd,cwd.split("/").length-1,cwd.split("/").pop());veil.classList.add("on");});
window.addEventListener("dragover",function(e){e.preventDefault();});
window.addEventListener("dragleave",function(e){if(!hasFiles(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)veil.classList.remove("on");});
window.addEventListener("drop",async function(e){
  e.preventDefault();dragDepth=0;veil.classList.remove("on");
  if(!hasFiles(e)||GUEST)return;
  if(cwd==="requests"||cwd==="profiles"||cwd==="settings"){toast("Open a library first, then drop your files");return;}
  var items=e.dataTransfer.items,out=[],where=cwd;
  if(items&&items.length&&items[0].webkitGetAsEntry){
    var arr=[].slice.call(items);      // handles and entries must be taken now: the items stop working after the first await
    var hs=arr.map(function(i){return i.getAsFileSystemHandle?i.getAsFileSystemHandle().catch(function(){return null;}):Promise.resolve(null);});
    var entries=arr.map(function(i){return i.webkitGetAsEntry();});
    var handles=await Promise.all(hs);
    for(var i=0;i<entries.length;i++){
      if(handles[i]&&handles[i].kind==="directory"){await startDir(handles[i],where);}
      else if(entries[i])await walk(entries[i],"",out);
    }
  }else{[].forEach.call(e.dataTransfer.files,function(f){out.push({file:f,rel:f.name});});}
  if(out.length)enqueue(out,{cwd:where});
});

function paintWho(){var w=$("whoT");if(w)w.textContent=ME||(GUEST?"":"admin");}
function signOut(){fetch("/auth/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}",credentials:"same-origin"}).finally(function(){location.href="/login";});}
$("signout").onclick=signOut;$("signout2").onclick=signOut;
$("settingsBtn").onclick=$("settingsBtn2").onclick=function(){go("settings");};
if(GUEST){$("settingsBtn").hidden=true;$("settingsBtn2").hidden=true;}
var UPWHAT={movies:"movies",shows:"TV shows",music:"music",audiobooks:"audiobooks"};
function upWhat(){return UPWHAT[cwd.split("/")[0]]||"";}
function paintUpload(){var w=upWhat();$("upT").textContent=w?"Upload "+w:"Upload";}
function render(){
  var rq=cwd==="requests"||cwd==="profiles"||cwd==="settings";
  paintUpload();
  ["filter","newFolder","upBtn"].forEach(function(id){$(id).hidden=rq;});closeMenu();
  renderNav();renderCrumbs();
  if(cwd==="profiles"){renderProfiles();return;}
  if(cwd==="settings"){renderSettings();return;}
  if(rq){renderRequests();return;}
  renderHero();listDir();
}
cwd=fromHash();if(!location.hash)go(cwd);render();loadRequests();
if(GUEST){loadHave().then(refreshTiles);}else{loadSpace();fetch("/_meta/me",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d)ME=d.user;paintWho();}).catch(function(){});}
paintWho();showResume();
if(!GUEST){setInterval(loadSpace,60000);loadStats();setInterval(function(){if(!document.hidden)loadStats();},4000);}
})();
</script>
