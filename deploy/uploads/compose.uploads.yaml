# OPTIONAL upload page: drag & drop your media from a browser into the library folders.
# Set it up with scripts/05-setup-uploads.sh, which copies this file to /opt/jellyfin and starts it:
#   docker compose -f compose.yaml -f compose.uploads.yaml up -d
#
# Dufs (a small, maintained file server) with a custom front-end page (uploads/assets/index.html).
# This is the ONLY service that can write to /srv/media. Jellyfin keeps its read-only view.
services:
  uploads:
    image: sigoden/dufs:${DUFS_VERSION:?set DUFS_VERSION in .env}
    container_name: uploads
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    restart: unless-stopped
    networks: [web]
    command:
      - /data
      - --port=5000
      - --allow-upload
      - --allow-delete
      - --allow-search
      - --hidden=lost+found
      - --assets=/assets
    env_file:
      - ./uploads.env              # DUFS_AUTH=user:$6$hash@/:rw  (created by the setup script, mode 600)
    volumes:
      - /srv/media:/data
      - ./uploads/assets:/assets:ro
    mem_limit: 128m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only helper for the upload page: posters/titles from Jellyfin and disk usage. Needs a Jellyfin API key
  # (created once as "upload-meta") in ./uploads-meta.env  ->  JELLYFIN_API_KEY=...  (mode 600).
  uploads-meta:
    image: python:3.12-alpine
    container_name: uploads-meta
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    restart: unless-stopped
    networks: [web]
    command: ["python", "/app/meta.py"]
    env_file:
      - ./uploads-meta.env
    volumes:
      - ./uploads/meta:/app:ro
      - ./uploads/data:/db              # the request list (SQLite)
      - ./uploads/assets:/assets:ro      # the page, also served to guest profiles
      - /srv/media:/data:ro
    mem_limit: 384m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
